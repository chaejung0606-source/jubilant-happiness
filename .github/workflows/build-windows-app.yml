name: 회의록도구 Windows 앱 빌드

# 소스가 바뀔 때마다 윈도우에서 .exe 를 만들어 Releases 에 올립니다.
# Actions 탭에서 "Run workflow" 로 직접 돌릴 수도 있습니다.
on:
  push:
    paths:
      - "core.py"
      - "회의록도구.pyw"
      - "build_app.py"
      - "icon.ico"
      - ".github/workflows/build-windows-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # 빌드 서버 콘솔은 기본이 cp1252 라 한글 출력/한글 경로에서 깨진다.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 빌드
        shell: pwsh
        run: python build_app.py

      - name: 만들어졌는지 확인
        shell: pwsh
        run: |
          $exe = "회의록도구.exe"
          if (-not (Test-Path $exe)) { throw "$exe 가 만들어지지 않았습니다." }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "$exe  ($mb MB)"

      - name: 실행되는지 확인
        shell: pwsh
        # 빌드 서버에는 화면이 없어 실패할 수 있으므로 참고용으로만 본다.
        continue-on-error: true
        run: |
          # 창을 띄운 뒤 15초간 살아있으면 정상 기동으로 본다.
          $p = Start-Process -FilePath ".\회의록도구.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "종료 코드: $($p.ExitCode)"
            if (Test-Path "오류기록.txt") { Get-Content "오류기록.txt" }
            throw "프로그램이 바로 종료되었습니다."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "정상 기동 확인"

      - name: 결과물 올리기 (Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: 회의록도구-windows
          path: 회의록도구.exe
          if-no-files-found: error

      - name: 릴리스에 올리기 (상시 다운로드 링크)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "app-latest"

          # GitHub 은 릴리스 첨부파일 이름에서 한글을 지워 default.exe 로 만들어 버린다.
          # 그래서 첨부는 ASCII 이름으로 올리고, 표시 이름만 한글로 붙인다.
          Copy-Item "회의록도구.exe" "MeetingMinutes.exe" -Force

          # 실행기 버전. 실행기(.pyw)가 바뀔 때만 올라가며, 이 값이 오르면
          # 사용자가 .exe 를 새로 받아야 한다. 평소에는 core.py 만 갱신된다.
          $ver = (Select-String -Path "회의록도구.pyw" -Pattern '^LAUNCHER_VERSION\s*=\s*(\d+)').Matches[0].Groups[1].Value
          Set-Content -Path "version.json" -Value ('{"launcher": ' + $ver + '}') -Encoding utf8
          Write-Host "실행기 버전: $ver"

          # 이전 릴리스/태그가 있으면 지우고 새로 만든다. (없어도 오류로 보지 않는다)
          gh release delete $tag --yes 2>$null
          git push origin ":refs/tags/$tag" 2>$null
          $global:LASTEXITCODE = 0

          # 여러 줄 설명은 파일로 넘긴다. (YAML 들여쓰기와 충돌하지 않게)
          $notes = @(
            "윈도우용 회의록 자동 작성 도구입니다.",
            "",
            "**처음 한 번만** 아래 **MeetingMinutes.exe** 를 내려받으시면 됩니다.",
            "이후 기능이 바뀌어도 프로그램이 켜질 때 알아서 최신 기능을 받아오므로",
            "다시 내려받지 않으셔도 됩니다.",
            "",
            "(GitHub 이 첨부파일 이름에 한글을 허용하지 않아 영문 이름입니다.",
            " 받은 뒤 ``회의록도구.exe`` 로 바꾸셔도 그대로 동작합니다.)",
            "",
            "단, 회의록을 만들려면 그 PC 에도 Claude Code 가 설치·로그인되어 있어야 합니다.",
            "(명령 프롬프트에서 claude --version 이 동작해야 합니다.)",
            "",
            "실행기 버전: $ver / 빌드 커밋: $env:GITHUB_SHA"
          ) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          gh release create $tag `
            "MeetingMinutes.exe#회의록도구 (윈도우용 실행 파일)" `
            "core.py#기능 파일 (프로그램이 자동으로 받아갑니다)" `
            "version.json#실행기 버전 정보" `
            --title "회의록도구 (최신 빌드)" --notes-file release-notes.md --target $env:GITHUB_SHA
